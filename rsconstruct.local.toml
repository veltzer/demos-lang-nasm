# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# The Makefile assembled each src/**/*.asm with nasm (-f elf64) and linked it
# with ld, writing out/<dir>/<name>.o and .elf. rsconstruct runs the same two
# steps through a wrapper (nasm's assemble-then-ld is not a one-shot compile).
[processor.explicit.nasm]
command = "scripts/nasm_link.py"
src_dirs = ["src"]
src_extensions = [".asm"]
